name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit tests run in `test`; Testcontainers suites (*IT, real Kafka + PostgreSQL) run in `verify`.
      # Docker is available on GitHub-hosted Ubuntu runners.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Test summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, re
          total = fail = err = skip = 0
          for p in glob.glob("target/surefire-reports/TEST-*.xml") + glob.glob("target/failsafe-reports/TEST-*.xml"):
              head = open(p, encoding="utf-8").read(4000)
              g = lambda k: int(re.search(k + r'="(\d+)"', head).group(1))
              total += g("tests"); fail += g("failures"); err += g("errors"); skip += g("skipped")
          print(f"### Tests\n\n| total | failures | errors | skipped |\n|---|---|---|---|\n| {total} | {fail} | {err} | {skip} |")
          EOF

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 14
