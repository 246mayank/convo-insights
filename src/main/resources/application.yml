spring:
  application:
    name: convo-insights
  datasource:
    url: jdbc:postgresql://localhost:5432/insights
    username: insights
    password: insights
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: convo-insights
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 20
      properties:
        # Detect a dead consumer in ~10 s instead of the 45 s default, so its partitions are
        # reassigned quickly after a crash. Heartbeats run on a background thread, so long LLM
        # calls don't trip this; max.poll.interval.ms (5 min) bounds processing time per poll.
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        linger.ms: 5
    listener:
      ack-mode: manual_immediate
      concurrency: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

insights:
  topics:
    raw: conversations.raw
    enriched: insights.enriched
    dead-letter: conversations.raw.DLT
  outbox:
    relay-enabled: true
    poll-ms: 200
    batch-size: 200
  retry:
    max-attempts: 3
    initial-interval-ms: 1000
    multiplier: 2.0
  llm:
    provider: ${LLM_PROVIDER:ollama}
    prompt-version: v1
    timeout: 20s
    circuit-open-for: 30s
    max-input-chars: 2000
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen2.5:3b}
      num-ctx: 2048
      num-predict: 160
