spring:
  application:
    name: convo-insights
  datasource:
    url: jdbc:postgresql://localhost:5432/insights
    username: insights
    password: insights
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: convo-insights
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 20
      properties:
        # Detect a dead consumer in ~10 s instead of the 45 s default, so its partitions are
        # reassigned quickly after a crash. Heartbeats run on a background thread, so long LLM
        # calls don't trip this; max.poll.interval.ms (5 min) bounds processing time per poll.
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        linger.ms: 5
    streams:
      application-id: convo-insights-analytics
      replication-factor: 1
      properties:
        # Kafka -> Kafka is where exactly-once really applies: aggregates stay exact if Streams crashes.
        processing.guarantee: exactly_once_v2
        state.dir: ${java.io.tmpdir}/convo-insights-streams
    template:
      observation-enabled: true   # producer spans + W3C traceparent header on every record
    listener:
      observation-enabled: true   # consumer spans continue the producer's trace
      ack-mode: manual_immediate
      concurrency: 3

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      enabled: false              # turned on by the 'tracing' profile (Jaeger via OTLP)
  otlp:
    metrics:
      export:
        enabled: false            # metrics go to Prometheus; OTLP is used for traces only
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

insights:
  topics:
    raw: conversations.raw
    enriched: insights.enriched
    segment: insights.segment
    dead-letter: conversations.raw.DLT
    brand-sentiment: analytics.brand-sentiment
    alerts: alerts.sentiment-spike
  analytics:
    enabled: true
    bucket: DAY
    spike:
      min-conversations: 20
      negative-share: 0.8
  twilio:
    # Empty token = webhook disabled (503). The URL must be the exact public URL Twilio calls,
    # because it is part of what the signature covers.
    auth-token: ${TWILIO_AUTH_TOKEN:}
    webhook-url: ${TWILIO_WEBHOOK_URL:http://localhost:8080/webhooks/twilio/conversations}
    brand: ${TWILIO_BRAND:twilio-demo}
  outbox:
    relay-enabled: true
    poll-ms: 200
    batch-size: 200
  retry:
    max-attempts: 3
    initial-interval-ms: 1000
    multiplier: 2.0
  llm:
    provider: ${LLM_PROVIDER:ollama}
    prompt-version: v1
    timeout: 20s
    circuit-open-for: 30s
    max-input-chars: 2000
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen2.5:3b}
      num-ctx: 2048
      num-predict: 160
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
